  function renderOrdersList(){
    const el = document.getElementById("ordersList");
    if (!el) return;
    const orders = [...lastOrders].sort((a,b)=>b.createdAt-a.createdAt);
    if (!orders.length){
      el.innerHTML = `<div class="empty-state">${ICONS.empty}<div>Encara no hi ha comandes.</div></div>`;
      return;
    }
    el.innerHTML = orders.map(o=>{
      const rounds = getRounds(o);
      const itemsHtml = rounds.map((r, idx)=>{
        const roundItems = (r.items||[]).map(it=>
          `<div class="ticket-item"><span><span class="qty-tag">${it.qty}×</span>${it.name}</span><span>${fmt(it.price*it.qty)}</span></div>`
          + (it.mods ? `<div class="ticket-mod">⚠ ${it.mods}</div>` : "")
        ).join("");
        const divider = (idx > 0 || r.cancelled)
          ? `<div class="round-divider">${r.cancelled ? "✕ Cancel·lat pel client" : "+ Afegit després"} · ${timeAgo(r.createdAt)}</div>`
          : "";
        return `<div class="${r.cancelled ? 'round-cancelled' : ''}">${divider}${roundItems}</div>`;
      }).join("");
      const activeRounds = rounds.filter(r=>!r.cancelled);
      const totalTip = activeRounds.reduce((a,r)=>a+(r.tip||0),0);
      const totalAmount = activeRounds.reduce((a,r)=>a+roundTotal(r),0);
      const lastPagoRound = activeRounds[activeRounds.length-1] || rounds[rounds.length-1];
      const pago = lastPagoRound ? lastPagoRound.pago : "tarjeta";
      const cancelled = o.estado === "cancelada";
      const statusHtml = cancelled
        ? `<span class="cancel-tag">Cancel·lada ${o.cancelledBy==="client" ? "pel client" : "per sala"}</span>`
        : STATUS_FLOW.map(s=>`<button class="status-pill ${o.estado===s?'current':''}" data-status="${o._id}|${s}">${STATUS_LABEL[s]}</button>`).join("")
          + `<button class="refund-pill" data-cancelsala="${o._id}">Cancel·lar</button>`;
      return `
        <div class="order-ticket ${cancelled?'cancelled':''}">
          <div class="ticket-head">
            <span class="ticket-mesa">Taula ${o.mesa}</span>
            <span class="ticket-head-right">
              <span class="ticket-time">${timeAgo(o.createdAt)}</span>
              <button class="ticket-del" data-del="${o._id}" aria-label="Eliminar comanda">${ICONS.trash}</button>
            </span>
          </div>
          ${itemsHtml}
          ${totalTip ? `<div class="ticket-item ticket-tip"><span>Propina</span><span>${fmt(totalTip)}</span></div>` : ""}
          <div class="ticket-total"><span>Total${pago==="efectivo" ? " · paguen en efectiu" : " · paguen amb targeta"}</span><span>${fmt(totalAmount)}</span></div>
          <div class="status-row">${statusHtml}</div>
        </div>`;
    }).join("");
    el.querySelectorAll("[data-status]").forEach(b=>{
      b.addEventListener("click", async ()=>{
        const [id, status] = b.dataset.status.split("|");
        const db = await getDb();
        if (db) { try{ await db.collection("orders").doc(id).update({ estado: status }); }catch(e){} }
        else { const o = lastOrders.find(x=>x._id===id); if (o) o.estado = status; renderOrdersList(); }
      });
    });
    el.querySelectorAll("[data-cancelsala]").forEach(b=>{
      b.addEventListener("click", ()=> cancelOrderSala(b.dataset.cancelsala));
    });
    el.querySelectorAll("[data-del]").forEach(b=>{
      b.addEventListener("click", async ()=>{
        const id = b.dataset.del;
        const db = await getDb();
        if (db) { try{ await db.collection("orders").doc(id).delete(); }catch(e){} }
        lastOrders = lastOrders.filter(x=>x._id!==id);
        renderOrdersList();
      });
    });

  /* ---------------- db wiring ---------------- */
  async function getDb(){
    if (dbAvailable === false) return null;
    if (dbRef) return dbRef;
    try{
      const db = window.claude ? await window.claude.use("db") : null;
      dbRef = db;
      dbAvailable = !!db;
      return db;
    }catch(e){
      dbAvailable = false;
      return null;
    }
  }

  let unsubSoldout = null;
  let unsubPrices = null;
  let unsubProducts = null;

  /* ---------------- productes afegits pel restaurant ----------------
     El restaurant pot afegir plats nous des de Sala (nom, preu, foto de la galeria,
     categoria i al·lèrgens). Es guarden a la base de dades i apareixen a la carta de
     totes les taules a l'instant, com si sempre hi haguessin estat. */
  // Mateixos noms que la llegenda de la carta impresa de Kaliu (els 14 del Reglament UE 1169/2011)
  const ALLERGEN_LIST = ["Gluten","Crustacis","Ou","Peix","Cacauet","Soja","Llet",
    "Fruits de closca","Api","Mostassa","Sèsam","Sulfits","Tramussos","Marisc"];
  // productes desats amb els noms antics
  const ALLERGEN_ALIAS = { "Lactis":"Llet", "Fruits secs":"Fruits de closca", "Mol·luscs":"Marisc" };
  const ALLERGEN_I18N = {
    "Gluten":{es:"Gluten",en:"Gluten",fr:"Gluten"}, "Crustacis":{es:"Crustáceos",en:"Crustaceans",fr:"Crustacés"},
    "Ou":{es:"Huevo",en:"Egg",fr:"Œuf"}, "Peix":{es:"Pescado",en:"Fish",fr:"Poisson"},
    "Cacauet":{es:"Cacahuete",en:"Peanut",fr:"Arachide"}, "Soja":{es:"Soja",en:"Soy",fr:"Soja"},
    "Llet":{es:"Leche",en:"Milk",fr:"Lait"}, "Fruits de closca":{es:"Frutos de cáscara",en:"Tree nuts",fr:"Fruits à coque"},
    "Api":{es:"Apio",en:"Celery",fr:"Céleri"}, "Mostassa":{es:"Mostaza",en:"Mustard",fr:"Moutarde"},
    "Sèsam":{es:"Sésamo",en:"Sesame",fr:"Sésame"}, "Sulfits":{es:"Sulfitos",en:"Sulphites",fr:"Sulfites"},
    "Tramussos":{es:"Altramuces",en:"Lupin",fr:"Lupin"}, "Marisc":{es:"Moluscos",en:"Molluscs",fr:"Mollusques"}
  };
  const TAG_CHOICES = [["vegano","Vegà"],["vegetariano","Vegetarià"],["sin-gluten","Sense gluten"],["picante","Picant"]];

  function productToItem(docId, v){
    const allergens = (Array.isArray(v.allergens) ? v.allergens : [])
      .map(a => ALLERGEN_ALIAS[a] || a).filter(a => ALLERGEN_I18N[a]);
    const i18n = {};
    ["es","en","fr"].forEach(lg => { i18n[lg] = { al: allergens.map(a => ALLERGEN_I18N[a][lg]) }; });
    return {
      id: "cx-" + docId, docId, custom: true,
      // text escrit pel personal: fora < > perquè no es pugui colar codi a la carta
      name: String(v.name || "").replace(/[<>]/g, "").slice(0, 80),
      desc: String(v.desc || "").replace(/[<>]/g, "").slice(0, 240),
      price: v.price, basePrice: v.price,
      tags: (Array.isArray(v.tags) ? v.tags : []).filter(t => TAG_META[t]),
      allergens, ingredients: [], photo: typeof v.photo === "string" && v.photo.startsWith("data:image/") ? v.photo : null,
      options: null, extras: [], i18n
    };
  }

  function applyProducts(docs){
    // treu els productes afegits abans i torna a posar els d'ara
    MENU.forEach(c => { c.items = c.items.filter(it => !it.custom); });
    for (let i = ALL_ITEMS.length - 1; i >= 0; i--) if (ALL_ITEMS[i].custom) ALL_ITEMS.splice(i, 1);
    docs.forEach(({id, v}) => {
      if (!v || !v.name || typeof v.price !== "number") return;
      const cat = MENU.find(c => c.cat === v.cat) || MENU[0];
      const it = productToItem(id, v);
      cat.items.push(it);
      ALL_ITEMS.push(it);
    });
    // si un producte s'ha esborrat i algú el tenia al carretó, el traiem
    Object.keys(state.cart).forEach(id => {
      if (!ALL_ITEMS.some(x => x.id === id)){ delete state.cart[id]; delete state.cartMods[id]; }
    });
  }

  function applyPrices(){
    ALL_ITEMS.forEach(it => {
      const p = state.prices[it.id];
      it.price = p ? p.price : it.basePrice;
    });
  }

  // Suscripción viva desde el arranque: el cliente ve l'estat de la seva comanda
  // i els plats esgotats sense haver d'entrar a la vista Sala.
  async function initRealtime(){
    const db = await getDb();
    if (!db) return false;
    if (!unsubOrders){
      unsubOrders = db.collection("orders").onSnapshot(snap=>{
        lastOrders = snap.docs.map(d=>({ _id:d.id, ...d.data() }));
        checkNewActivity();
        renderOrdersList();
        renderReport();
        renderMyOrder();
        renderCartbar();
      }, ()=>{});
    }
    if (!unsubCalls){
      unsubCalls = db.collection("calls").onSnapshot(snap=>{
        lastCalls = snap.docs.map(d=>({ _id:d.id, ...d.data() }));
        checkNewActivity();
        renderCallsList();
        renderReport();
      }, ()=>{});
    }
    if (!unsubSoldout){
      unsubSoldout = db.collection("soldout").onSnapshot(snap=>{
        const next = {};
        snap.docs.forEach(d=>{ const v = d.data(); if (v && v.itemId) next[v.itemId] = d.id; });
        const changed = JSON.stringify(next) !== JSON.stringify(state.soldout);
        state.soldout = next;
        if (changed){
          if (state.view === "cliente") renderCliente();
          renderStockList();
        }
      }, ()=>{});
    }
    if (!unsubProducts){
      unsubProducts = db.collection("products").onSnapshot(snap=>{
        const docs = snap.docs.map(d => ({ id:d.id, v:d.data() }))
          .sort((a,b) => ((a.v && a.v.createdAt) || 0) - ((b.v && b.v.createdAt) || 0));
        applyProducts(docs);
        applyPrices();
        if (state.view === "cliente") renderCliente();
        renderCartbar();
        renderStockList();
      }, ()=>{});
    }
    if (!unsubPrices){
      unsubPrices = db.collection("prices").onSnapshot(snap=>{
        const next = {};
        snap.docs.forEach(d=>{
          const v = d.data();
          if (v && v.itemId && typeof v.price === "number") next[v.itemId] = { docId:d.id, price:v.price };
        });
        const changed = JSON.stringify(next) !== JSON.stringify(state.prices);
        state.prices = next;
        if (changed){
          applyPrices();
          // el nou preu arriba a totes les taules a l'instant, també a qui ja el té a la comanda
          if (state.view === "cliente") renderCliente();
          renderCartbar();
          // només on es veuen imports: no refem la fitxa si algú està escrivint una nota
          if (state.checkoutStep === "cart" || state.checkoutStep === "confirm") renderModal();
          renderStockList();
        }
      }, ()=>{});
    }
    return true;
  }

  /* ---------------- disponibilitat (esgotats) ---------------- */
  function isSoldout(id){ return !!state.soldout[id]; }

  async function toggleSoldout(id){
    const db = await getDb();
    if (!db){
      // sense db: canvi només local, per poder ensenyar-ho igualment
      if (state.soldout[id]) delete state.soldout[id]; else state.soldout[id] = "local";
      renderStockList(); if (state.view === "cliente") renderCliente();
      return;
    }
    try{
      if (state.soldout[id]) await db.collection("soldout").doc(state.soldout[id]).delete();
      else await db.collection("soldout").add({ itemId:id, createdAt: Date.now() });
    }catch(e){}
  }

  /* ---------------- preus editables des de Sala ---------------- */
  // Accepta "12,90", "12.90", "12,9 €"... Retorna null si no és un preu raonable.
  function parsePrice(txt){
    const clean = String(txt).replace(/[€\s]/g, "").replace(",", ".");
    if (!/^\d{1,3}(\.\d{1,2})?$/.test(clean)) return null;
    const n = Math.round(parseFloat(clean) * 100) / 100;
    return (n > 0 && n < 1000) ? n : null;
  }
  function priceInputValue(n){ return n.toFixed(2).replace(".", ","); }

  async function savePrice(id, value){
    const it = ALL_ITEMS.find(x=>x.id===id);
    if (!it) return false;
    const n = parsePrice(value);
    if (n === null) return false;
    const cur = state.prices[id];
    const tornaAlOriginal = Math.abs(n - it.basePrice) < 0.005;

    const db = await getDb();
    if (!db){
      // sense db: canvi només en aquest mòbil, per poder-ho ensenyar igualment
      if (tornaAlOriginal) delete state.prices[id]; else state.prices[id] = { docId:"local", price:n };
      applyPrices(); renderStockList(); if (state.view === "cliente") renderCliente(); renderCartbar();
      return true;
    }
    try{
      if (tornaAlOriginal){
        if (cur) await db.collection("prices").doc(cur.docId).delete();
      } else if (cur){
        await db.collection("prices").doc(cur.docId).update({ price:n, updatedAt: Date.now() });
      } else {
        await db.collection("prices").add({ itemId:id, price:n, updatedAt: Date.now() });
      }
      return true;
    }catch(e){ return false; }
  }

  let stockRenderPending = false;
  function renderStockList(){
    const el = document.getElementById("stockList");
    if (!el) return;
    // si algú està escrivint un preu, no li esborrem el camp: repintem quan acabi
    if (el.contains(document.activeElement) && document.activeElement.matches(".price-input")){
      stockRenderPending = true;
      return;
    }
    stockRenderPending = false;
    const q = normalizeTxt(state.salaSearch || "");
    const items = ALL_ITEMS.filter(it => !q || normalizeTxt(it.name).includes(q));
    const outCount = Object.keys(state.soldout).length;
    const changedCount = Object.keys(state.prices).length;
    const head = document.getElementById("stockCount");
    if (head){
      const parts = [outCount ? `${outCount} esgotats` : "Tot disponible"];
      if (changedCount) parts.push(`${changedCount} preus canviats`);
      head.textContent = parts.join(" · ");
    }
    if (!items.length){
      el.innerHTML = `<div class="empty-state">${ICONS.empty}<div>Cap plat amb aquest nom.</div></div>`;
      return;
    }
    el.innerHTML = items.map(it=>{
      const off = isSoldout(it.id);
      const changed = !!state.prices[it.id];
      return `<div class="stock-row ${off?'off':''} ${changed?'changed':''}">
        <span class="stock-name">${it.name}${it.custom ? ` <span class="new-tag">Afegit</span>` : ""}
          ${it.custom ? `<button class="del-product" data-del="${it.id}">Treure de la carta</button>` : ""}
          ${changed ? `<span class="price-was">Abans ${fmt(it.basePrice)}
            <button class="price-reset" data-reset="${it.id}">Recuperar</button></span>` : ""}
        </span>
        <span class="price-field">
          <input class="price-input" data-price="${it.id}" inputmode="decimal" autocomplete="off"
                 value="${priceInputValue(it.price)}" aria-label="Preu de ${it.name}">
          <span class="price-eur">€</span>
        </span>
        <button class="switch ${off?'on':''}" data-stock="${it.id}" aria-label="Marcar esgotat">
          <span class="knob"></span>
        </button>
      </div>`;
    }).join("");
    el.querySelectorAll("[data-stock]").forEach(b=>{
      b.addEventListener("click", ()=> toggleSoldout(b.dataset.stock));
    });
    el.querySelectorAll("[data-del]").forEach(b=>{
      b.addEventListener("click", ()=>{
        // dos tocs: el primer demana confirmació, el segon esborra
        if (b.dataset.armed){ deleteProduct(b.dataset.del); return; }
        b.dataset.armed = "1"; b.textContent = "Segur? Toca de nou per treure'l"; b.classList.add("armed");
        setTimeout(()=>{ if (b.isConnected){ delete b.dataset.armed; b.textContent = "Treure de la carta"; b.classList.remove("armed"); } }, 4000);
      });
    });
    el.querySelectorAll("[data-reset]").forEach(b=>{
      b.addEventListener("click", async ()=>{
        const it = ALL_ITEMS.find(x=>x.id===b.dataset.reset);
        if (it && await savePrice(it.id, priceInputValue(it.basePrice))) showToast("Preu original recuperat");
      });
    });
    el.querySelectorAll(".price-input").forEach(inp=>{
      const id = inp.dataset.price;
      const commit = async ()=>{
        const it = ALL_ITEMS.find(x=>x.id===id);
        const n = parsePrice(inp.value);
        if (n === null){
          inp.classList.add("bad");
          showToast("Preu no vàlid. Escriu-lo així: 12,90");
          inp.value = priceInputValue(it.price);
          setTimeout(()=>inp.classList.remove("bad"), 1200);
          return;
        }
        if (Math.abs(n - it.price) < 0.005){ inp.value = priceInputValue(it.price); return; }
        inp.disabled = true;
        const ok = await savePrice(id, inp.value);
        inp.disabled = false;
        showToast(ok ? `${it.name}: ara ${fmt(n)}` : "No s'ha pogut desar el preu");
      };
      inp.addEventListener("focus", ()=> inp.select());
      inp.addEventListener("keydown", e=>{
        if (e.key === "Enter"){ e.preventDefault(); inp.blur(); }
        if (e.key === "Escape"){ inp.value = priceInputValue(ALL_ITEMS.find(x=>x.id===id).price); inp.blur(); }
      });
      inp.addEventListener("blur", async ()=>{
        await commit();
        if (stockRenderPending) renderStockList();
      });
    });
  }

  // La foto de la galeria del mòbil pot fer 4-10 MB. La retallem quadrada i la
  // reduïm a 600 px abans de desar-la: pesa poc, carrega ràpid i es veu nítida.
  async function compressPhoto(file){
    let bmp;
    try { bmp = await createImageBitmap(file); }
    catch(e){
      bmp = await new Promise((res, rej)=>{
        const img = new Image();
        img.onload = ()=>res(img); img.onerror = ()=>rej(new Error("decode"));
        img.src = URL.createObjectURL(file);
      });
    }
    const w = bmp.width, h = bmp.height, s = Math.min(w, h);
    const side = Math.min(600, s);
    const c = document.createElement("canvas");
    c.width = side; c.height = side;
    const ctx = c.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(bmp, (w - s) / 2, (h - s) / 2, s, s, 0, 0, side, side);
    let q = 0.84, url = c.toDataURL("image/jpeg", q);
    while (url.length > 170000 && q > 0.45){ q -= 0.08; url = c.toDataURL("image/jpeg", q); }
    return url;
  }

      if (!f) return;
      try { d.photo = await compressPhoto(f); d.error = ""; }
      catch(e){ d.error = "No s'ha pogut llegir aquesta foto. Prova amb una altra."; }
      renderAddProduct();
    });
    box.querySelectorAll("[data-alg]").forEach(b=> b.addEventListener("click", ()=>{
      const a = b.dataset.alg;
      d.allergens = d.allergens.includes(a) ? d.allergens.filter(x=>x!==a) : [...d.allergens, a];
      b.classList.toggle("on");
    }));
    box.querySelectorAll("[data-tagk]").forEach(b=> b.addEventListener("click", ()=>{
      const k = b.dataset.tagk;
      d.tags = d.tags.includes(k) ? d.tags.filter(x=>x!==k) : [...d.tags, k];
      b.classList.toggle("on");
    }));
    // quan toquen alguna cosa, l'avís d'error antic ja no toca
    box.addEventListener("input", ()=>{ d.error = ""; box.querySelector(".ap-error")?.remove(); });
    box.addEventListener("click", e=>{ if (e.target.closest(".ap-chip")){ d.error = ""; box.querySelector(".ap-error")?.remove(); } });
    $("apCancel").addEventListener("click", ()=>{ state.addProduct = null; renderAddProduct(); });
    $("apSave").addEventListener("click", saveProduct);
  }

  async function saveProduct(){
    const d = state.addProduct;
    if (!d || d.saving) return;
    const name = d.name.trim();
    const price = parsePrice(d.price);
    const animal = ["Llet","Ou","Peix","Crustacis","Marisc"];
    let err = "";
    if (name.length < 2) err = "Posa el nom del plat.";
    else if (price === null) err = "Posa un preu vàlid. Escriu-lo així: 12,90";
    else if (!d.photo) err = "Tria una foto del plat.";
    else if (d.tags.includes("sin-gluten") && d.allergens.includes("Gluten")) err = "Has marcat Gluten i també «Sense gluten». Revisa-ho.";
    else if (d.tags.includes("vegano") && d.allergens.some(a=>animal.includes(a))) err = "Un plat vegà no pot portar llet, ou, peix ni marisc. Revisa-ho.";
    if (err){ d.error = err; renderAddProduct(); return; }

    // vegà implica vegetarià: així surt als dos filtres
    const tags = d.tags.includes("vegano") && !d.tags.includes("vegetariano") ? [...d.tags, "vegetariano"] : d.tags;
    const doc = { name, price, cat:d.cat, desc:d.desc.trim(), photo:d.photo,
                  allergens:d.allergens, tags, createdAt: Date.now() };
    d.saving = true; d.error = ""; renderAddProduct();

    const db = await getDb();
    if (!db){
      // sense base de dades (vista prèvia): només en aquest mòbil
      applyProducts([...ALL_ITEMS.filter(x=>x.custom).map(x=>({id:x.docId, v:{name:x.name, price:x.basePrice, cat:(MENU.find(c=>c.items.includes(x))||{}).cat, desc:x.desc, photo:x.photo, allergens:x.allergens, tags:x.tags}})),
                     { id:"local" + Date.now(), v:doc }]);
      applyPrices();
    } else {
      try { await db.collection("products").add(doc); }
      catch(e){ d.saving = false; d.error = "No s'ha pogut desar. Torna-ho a provar."; renderAddProduct(); return; }
    }
    state.addProduct = null;
    state.salaSearch = name;
    const se = document.getElementById("stockSearch"); if (se) se.value = name;
    renderAddProduct(); renderStockList(); if (state.view === "cliente") renderCliente();
    showToast(`«${name}» ja és a la carta`);
  }

  async function deleteProduct(itemId){
    const it = ALL_ITEMS.find(x=>x.id===itemId);
    if (!it || !it.custom) return;
    const db = await getDb();
    if (!db){ applyProducts(ALL_ITEMS.filter(x=>x.custom && x.id!==itemId).map(x=>({id:x.docId, v:{name:x.name, price:x.basePrice, cat:(MENU.find(c=>c.items.includes(x))||{}).cat, desc:x.desc, photo:x.photo, allergens:x.allergens, tags:x.tags}}))); renderStockList(); return; }
    try{
      await db.collection("products").doc(it.docId).delete();
      if (state.prices[itemId]) await db.collection("prices").doc(state.prices[itemId].docId).delete();
      if (state.soldout[itemId]) await db.collection("soldout").doc(state.soldout[itemId]).delete();
      showToast(`«${it.name}» s'ha tret de la carta`);
    }catch(e){ showToast("No s'ha pogut esborrar"); }
  }

  /* ---------------- la meva comanda (client) ---------------- */
  // Una taula = una sola comanda oberta ("rounds"): cada enviament (primers plats,
  // després postres...) s'afegeix com una tanda dins el mateix tiquet, en comptes
  // de crear comandes noves separades a sala.
  function getRounds(o){
    if (Array.isArray(o.rounds)) return o.rounds;
    // compatibilitat amb comandes antigues (format d'una sola tanda)
    return [{ token:o.token, items:o.items||[], tip:o.tip||0, pago:o.pago||"tarjeta", createdAt:o.createdAt, cancelled:o.estado==="cancelada" }];
  }
  function roundTotal(round){
    return (round.items||[]).reduce((a,it)=>a+it.price*it.qty,0) + (round.tip||0);
  }
  function myOrderDocs(){
    const out = [];
    lastOrders.forEach(o=>{
      const mine = getRounds(o).filter(r=>state.myTokens.includes(r.token));
      if (mine.length) out.push({ order:o, myRounds:mine });
    });
    return out;
  }
  function myActiveTotal(){
    return myOrderDocs().reduce((a,{order,myRounds})=>{
      if (order.estado === "cancelada") return a;
      return a + myRounds.filter(r=>!r.cancelled).reduce((x,r)=>x+roundTotal(r),0);
    }, 0);
  }

  function confirmBill(){
    if (state.billRequested) return;
    const old = document.getElementById("billAsk"); if (old) old.remove();
    const el = document.createElement("div");
    el.id = "billAsk"; el.className = "ask-ov";
    el.innerHTML = `
      <div class="ask-card" role="alertdialog" aria-modal="true" aria-labelledby="billAskT">
        <div class="ask-icon">€</div>
        <h3 id="billAskT">${t("billQ")}</h3>
        <p class="ask-total">${fmt(myActiveTotal())}</p>
        <p class="ask-sub">${t("billQsub")}</p>
        <div class="ask-actions">
          <button class="ask-keep" id="billYes">${t("billYes")}</button>
          <button class="ask-yes" id="billNo">${t("billNo")}</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    const close = ()=>{ el.classList.add("out"); setTimeout(()=>el.remove(), 220); };

  // Confirmació abans de cancel·lar: el botó és a prop del dit i és fàcil tocar-lo sense voler.
  function confirmCancel(orderId, token, total){
    const old = document.getElementById("cancelAsk"); if (old) old.remove();
    const el = document.createElement("div");
    el.id = "cancelAsk"; el.className = "ask-ov";
    el.innerHTML = `
      <div class="ask-card" role="alertdialog" aria-modal="true">

          <button class="ask-keep" id="askKeep">${t("keepIt")}</button>
          <button class="ask-yes" id="askYes">${t("yesCancel")}</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    const close = ()=>{ el.classList.add("out"); setTimeout(()=>el.remove(), 220); };
    el.querySelector("#askKeep").addEventListener("click", close);
    el.addEventListener("click", e=>{ if (e.target === el) close(); });
    el.querySelector("#askYes").addEventListener("click", ()=>{ close(); cancelMyOrder(orderId, token); });

  async function cancelMyOrder(orderId, token){
    const db = await getDb();
    if (!db) return;
    try{
      const order = lastOrders.find(o=>o._id===orderId);
      if (!order) return;
      const rounds = getRounds(order).map(r => r.token===token ? { ...r, cancelled:true, cancelledBy:"client", cancelledAt:Date.now() } : r);
      await db.collection("orders").doc(orderId).update({ rounds });
      showToast(t("toastCancel"));
    }catch(e){}
  }

  function renderMyOrder(){
    const el = document.getElementById("myOrderBox");
    if (!el) return;
    const docs = myOrderDocs().sort((a,b)=>(b.order.createdAt||0)-(a.order.createdAt||0));
    if (!docs.length){ el.innerHTML = ""; return; }
    const cardsHtml = docs.map(({order, myRounds})=>{
      const wholeCancelled = order.estado === "cancelada";
      const st = wholeCancelled ? "cancelada" : (order.estado || "nuevo");
      const label = t("st_" + st) || st;
      const total = myRounds.filter(r=>!r.cancelled).reduce((a,r)=>a+roundTotal(r),0);
      const lastRound = myRounds[myRounds.length-1];
      const cancelable = !wholeCancelled && st === "nuevo" && lastRound && !lastRound.cancelled;
      return `<div class="myorder ${st==='cancelada'?'cancelled':''}">
        <div class="myorder-top">
          <span class="myorder-state">${st==='cancelada' ? '✕' : (st==='listo'||st==='entregado' ? '✓' : '●')} ${label}</span>
          <span class="myorder-total">${fmt(total)}</span>
        </div>
        ${st==='cancelada'
          ? `<p class="myorder-hint">${t("hintCancelled")}</p>`
          : cancelable
            ? `<p class="myorder-hint">${t("hintCancelable")}</p>
               <button class="cancel-btn" data-cancel="${order._id}|${lastRound.token}">${t("cancelOrder")}</button>`
            : `<p class="myorder-hint">${t("hintAccepted")}</p>`}
      </div>`;
    }).join("");
    const activeTotal = myActiveTotal();
    const billHtml = activeTotal > 0 ? `
      <div class="bill-box">
        <div class="bill-row"><span>${t("yourTotal")}</span><span>${fmt(activeTotal)}</span></div>
        <button class="bill-btn" id="wantBillBtn" ${state.billRequested ? 'disabled' : ''}>
          ${state.billRequested ? t("billRequested") : t("wantBill")}
        </button>
        ${state.billRequested ? "" : `<p class="myorder-hint">${t("billHint")}</p>`}
      </div>` : "";
    el.innerHTML = cardsHtml + billHtml;
    const billBtn = document.getElementById("wantBillBtn");
    if (billBtn) billBtn.addEventListener("click", confirmBill);
    el.querySelectorAll("[data-cancel]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const [orderId, token] = b.dataset.cancel.split("|");
        const o = lastOrders.find(x=>x._id===orderId);
        const r = o && getRounds(o).find(x=>x.token===token);
        confirmCancel(orderId, token, r ? roundTotal(r) : null);
      });
    });
  }

  /* ---------------- mascota / FAQ ---------------- */

  function normalizeTxt(s){
    return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  }

  // Busca a qué plato se refiere la pregunta, por nombre completo o por palabras significativas
  function findDish(q){
    const nq = normalizeTxt(q);
    const exact = ALL_ITEMS.find(it => nq.includes(normalizeTxt(it.name)) || nq.includes(normalizeTxt(dName(it))));
    if (exact) return exact;
    let best = null, bestScore = 0;
    ALL_ITEMS.forEach(it=>{
      const words = normalizeTxt(it.name + " " + dName(it)).split(/[^a-z0-9]+/).filter(w=>w.length>3);
      let score = 0;
      words.forEach(w=>{ if (nq.includes(w)) score++; });
      if (score > bestScore){ bestScore = score; best = it; }
    });
    return bestScore > 0 ? best : null;
  }

  function mascotReply(question){
    const q = normalizeTxt(question);
    const listByTag = (tag, labelKey) => {
      const label = t(labelKey).toLowerCase();
      const items = ALL_ITEMS.filter(it => it.tags.includes(tag));
      if (!items.length) return tv("noTag", { label });
      const list = items.slice(0,8).map(it=>dName(it)).join(", ");
      const extra = items.length > 8 ? tv("more", { n: items.length-8 }) : "";
      return tv("withTag", { label, list, extra });
    };
    if (/vegan|vegan[eo]|vegane/.test(q) && !/vegetari/.test(q)) return listByTag("vegano","vegan");
    if (/vegetari/.test(q)) return listByTag("vegetariano","veg");
    if (/sin.?glute|sense.?glute|gluten.?free|sans.?glute|celiac|celia/.test(q)) return listByTag("sin-gluten","nogluten");

    // Ingredients d'un plat
    if (/ingredient|que.{0,6}porta|que.{0,6}lleva|what.{0,6}in|contains|contient|que.{0,6}te\b|de que.{0,6}esta fet|compost/.test(q)){
      const dish = findDish(q);
      if (dish){
        // en altres idiomes fem servir la descripció traduïda si n'hi ha
        let ing;
        if (state.lang !== "ca" && dDesc(dish)) ing = dDesc(dish).replace(/\.\s*$/, "").toLowerCase();
        else ing = (dish.ingredients && dish.ingredients.length) ? dish.ingredients.join(", ") : "—";
        const alerg = dish.allergens.length ? tv("alergTxt", { list: dAllerg(dish).join(", ") }) : "";
        return tv("carries", { dish: dName(dish), ing, alerg });
      }
      return tv("whichDish");
    }

    // Treure un ingredient / al·lèrgies
    if (/treure|quitar|remove|retirer|sense\s\w|sin\s\w|without|sans\s\w|intoleran|al.?lergi|alergi|allerg/.test(q)){
      const dish = findDish(q);
      if (dish) return tv("removeOk", { dish: dName(dish) });
      return tv("removeAny");
    }

    if (/recoman|recomend|recommend|sugger|suggest|que.*demano|que.*pido/.test(q)){
      const pick = ALL_ITEMS.find(it=>it.id==="paella-marisc");
      return tv("recommend", { dish: dName(pick), desc: dDesc(pick) });
    }
    if (/camarer|cambrer|waiter|serveur|llamar/.test(q)) return tv("waiter");
    if (/\bvins?\b|\bvino|\bwine|vi negre|vi blanc|cava|copa de vi/.test(q)) return tv("wines");
    if (/infantil|nens|kid|child|enfant|canalla/.test(q)) return tv("kids");
    if (/postre|dol[cç]|dessert|pastis|sweet/.test(q)) return tv("desserts");
    if (/dividir|split|compte separat|cuenta separada|addition/.test(q)) return tv("split");
    if (/propina|tip\b|pourboire/.test(q)) return tv("tip");
    if (/pagar|pago|targeta|tarjeta|card|payer|efectiu|efectivo|cobr/.test(q)) return tv("pay");
    if (/al.?lerg|alerg|allerg/.test(q)) return tv("allerg");
    if (/wifi|wi-fi/.test(q)) return tv("wifi");
    if (/horari|horario|hours|heure|obriu|abris|open|tanqueu|a quina hora|a que hora/.test(q)) return tv("hours");
    if (/reserva|book|booking|reserver/.test(q)) return tv("booking");
    if (/aparca|parking|parquing/.test(q)) return tv("parking");
    if (/adre[cç]a|direccion|address|adresse|on esteu|donde estais|where are/.test(q)) return tv("address");
    if (/trona|high.?chair|chaise haute|ni[nñ]o|nen\b/.test(q)) return tv("highchair");
    if (/gos|perro|dog|chien|mascota|pet/.test(q)) return tv("pets");
    if (/per emportar|para llevar|take.?away|emporter/.test(q)) return tv("takeaway");
    if (/quant tarda|cuanto tarda|how long|combien de temps|temps d.espera|espera/.test(q)) return tv("waitTime");
    if (/gracies|gracias|thank|merci/.test(q)) return tv("thanks");
    return tv("fallback");
  }

  /* ---------------- view switching ---------------- */

  // Foto del local que va de fons a la carta. Per canviar-la, n'hi ha prou amb el nom.
  const BG_PHOTO = "";
  function applyBackground(){
    const el = document.getElementById("menuBg");
    if (!el) return;
    if (BG_PHOTO) el.style.backgroundImage = `url("${BG_PHOTO}")`;
    document.body.classList.toggle("bg-off", !BG_PHOTO || state.view !== "cliente");
  }
  (function(){
    const logo = document.querySelector(".topbar .brand img.logo");
    if (!logo) return;
    let taps = [];
    logo.addEventListener("click", ()=>{
      if (!salaAllowed) return;
      const now = Date.now();
      try{ if (now < (parseInt(localStorage.getItem("deu_pin_block")||"0",10) || 0)) return; }catch(e){}
      taps = taps.filter(t0 => now - t0 < 3000); taps.push(now);
      if (taps.length >= 5){ taps = []; state.salaAuth = false; setView("sala"); }
    });
  })();
  function setView(view){
    if (view === "sala"){
      if (!salaAllowed) return;              // placa de taula: no hi ha vista Sala
      if (!state.salaAuth){                  // la resta: PIN una sola vegada per mòbil
        state.pinError = false;
        state.checkoutStep = "pin";
        renderModal();
        return;
      }
    }
    state.view = view;
    document.getElementById("tabCliente").classList.toggle("active", view==="cliente");
    document.getElementById("tabSala").classList.toggle("active", view==="sala");
    document.getElementById("viewCliente").hidden = view!=="cliente";
    document.getElementById("viewSala").hidden = view!=="sala";
    if (view==="cliente") renderCliente();
    applyBackground();
    renderCartbar();
    renderMascot();
    renderOnboard();
    if (view==="sala"){
      if (!document.getElementById("viewSala").innerHTML) renderSala();
      const salaRoot = document.getElementById("viewSala");
      if (!salaRoot.querySelector("#connNote")){
        const noteDiv = document.createElement("div");
        noteDiv.className = "conn-note";
        noteDiv.id = "connNote";
        salaRoot.prepend(noteDiv);
      }
      initSala();
    }
  }

  document.getElementById("tabCliente").addEventListener("click", ()=>setView("cliente"));
  document.getElementById("tabSala").addEventListener("click", ()=>setView("sala"));

  /* ---------------- boot ---------------- */
  try{
    const saved = localStorage.getItem("deu_tokens");
    if (saved) state.myTokens = JSON.parse(saved) || [];
    if (localStorage.getItem("deu_sala_sound") === "0") state.salaSound = false;
  }catch(e){}

  // El navegador no deixa sonar res fins que l'usuari toca la pantalla:
  // preparem l'àudio al primer toc, sigui quin sigui.
  document.addEventListener("pointerdown", function once(){
    initAudio();
    if (audioCtx && audioCtx.state === "suspended"){ try{ audioCtx.resume(); }catch(e){} }
    document.removeEventListener("pointerdown", once);
  }, { once:true });

  state.mascotMsgs = [{ from:"bot", text: tv("hello") }];
  applyStaticLabels();
  document.getElementById("langSel").addEventListener("change", e=> setLang(e.target.value));
  document.getElementById("splashLangSel").addEventListener("change", e=> setLang(e.target.value));

  renderCliente();
  renderCartbar();
  renderMascot();
  renderOnboard();
  applyBackground();

  /* ================= ANIMACIONS (lògica) =================
     Es fa tot des de fora: vigila el que es pinta i hi afegeix el moviment,
     sense tocar com es construeix la carta. */
  (function setupAnimations(){
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || !("IntersectionObserver" in window)) return;

    // 1) aparició en fer scroll, només la primera vegada que es veu cada plat
    const seen = new Set();
    const io = new IntersectionObserver(entries=>{
      const batch = entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top || a.boundingClientRect.left-b.boundingClientRect.left);
      batch.forEach((e, i)=>{
        const el = e.target;
        el.style.setProperty("--d", Math.min(i, 8) * 0.06 + "s");
        el.classList.add("in");
        io.unobserve(el);
        // acabada l'entrada, treiem les classes perquè el toc/hover funcioni normal
        setTimeout(()=>{ el.classList.remove("rv","in"); el.style.removeProperty("--d"); }, 1400);
        if (el.dataset.open) seen.add(el.dataset.open);
        if (el.id) seen.add(el.id);
      });
    }, { rootMargin:"0px 0px 12% 0px", threshold:0.01 });

    function tagNew(root){
      root.querySelectorAll(".dish[data-open]").forEach(el=>{
        if (seen.has(el.dataset.open) || el.classList.contains("rv")) return;
        el.classList.add("rv"); io.observe(el);
      });
      root.querySelectorAll(".cat-title").forEach(el=>{
        if (seen.has(el.id) || el.classList.contains("rv")) return;
        el.classList.add("rv"); io.observe(el);
      });
      const fn = root.querySelector(".menu-foot-notice");
      if (fn && !seen.has("foot")){
        const o = new IntersectionObserver(es=>{ if (es[0].isIntersecting){ fn.classList.add("in"); seen.add("foot"); o.disconnect(); } }, {threshold:.6});
        o.observe(fn);
      }
    }
    const cli = document.getElementById("viewCliente");
    new MutationObserver(()=> tagNew(cli)).observe(cli, { childList:true, subtree:true });
    tagNew(cli);

    // 2) entrada de la carta en prémer "Benvingut"
    const enter = document.getElementById("splashEnterBtn");
    if (enter) enter.addEventListener("click", ()=>{
      document.body.classList.add("menu-in");
      setTimeout(()=>document.body.classList.remove("menu-in"), 1400);
    });

    // 3) botó +: salt i punt que vola cap a la barra de la comanda
    let pendingPop = null;
    document.addEventListener("click", e=>{
      const b = e.target.closest && e.target.closest("[data-inc], #addCustomBtn");
      if (!b || b.disabled) return;
      // des de la fitxa del plat (plats amb opcions): el salt el fa el + del plat a la carta
      const fromSheet = b.id === "addCustomBtn";
      const id = fromSheet ? state.customizeId : b.dataset.inc;
      const r = b.getBoundingClientRect();
      pendingPop = { id, x:r.left + r.width/2, y:r.top + r.height/2 };
      setTimeout(()=>{
        const p = pendingPop; pendingPop = null;
        if (!p) return;
        if (document.querySelector("#modalRoot .overlay")) return;   // s'ha obert la fitxa: encara no s'ha afegit
        const nb = document.querySelector(`[data-inc="${p.id}"]`);
        if (nb){
          nb.classList.add("pop"); const q = nb.parentElement.querySelector(".qty"); if (q) q.classList.add("pop");
          // si el + del plat es veu a la pantalla, el punt surt d'allà
          const nr = nb.getBoundingClientRect();
          if (nr.top > 0 && nr.bottom < window.innerHeight){ p.x = nr.left + nr.width/2; p.y = nr.top + nr.height/2; }
        }
        const target = document.getElementById("openCartBtn");
        if (!target) return;
        const t = target.getBoundingClientRect();
        const dot = document.createElement("div");
        dot.className = "fly-dot";
        dot.style.left = (p.x - 7) + "px"; dot.style.top = (p.y - 7) + "px";
        document.body.appendChild(dot);
        const dx = t.left + 34 - p.x, dy = t.top + t.height/2 - p.y;
        dot.animate([
          { transform:"translate(0,0) scale(1)", opacity:1 },
          { transform:`translate(${dx*0.5}px, ${dy*0.5 - 70}px) scale(1.2)`, opacity:1, offset:0.5 },
          { transform:`translate(${dx}px, ${dy}px) scale(.4)`, opacity:.3 }
        ], { duration:600, easing:"cubic-bezier(.4,0,.6,1)" }).onfinish = ()=>{
          dot.remove();
          const inner = document.querySelector(".cartbar-inner");
          if (inner){ inner.classList.remove("bump"); void inner.offsetWidth; inner.classList.add("bump"); }
        };
      }, 20);
    }, true);

    // 4) barra de comanda: entra amb rebot i el número bota quan canvia
    const cbw = document.getElementById("cartbarWrap");
    let lastCount = null;
    new MutationObserver(()=>{
      const bar = cbw.querySelector(".cartbar");
      const c = cbw.querySelector(".cartbar-inner span.count");
      const n = c ? c.textContent : (bar ? "sent" : null);
      if (bar && lastCount === null) bar.classList.add("enter");
      if (c && lastCount !== null && lastCount !== n){ c.classList.add("bump"); }
      lastCount = n;
    }).observe(cbw, { childList:true, subtree:true });

    // 5) fitxa / carretó: la làmina puja amb molla només quan s'obre, no a cada canvi
    const mr = document.getElementById("modalRoot");
    let wasOpen = false;
    new MutationObserver(()=>{
      const ov = mr.querySelector(".overlay");
      if (ov && !wasOpen) ov.classList.add("anim-open");
      else if (ov && wasOpen) ov.querySelectorAll(".cart-row,.opt-row,.ing-row").forEach(x=>x.style.animation="none");
      wasOpen = !!ov;
    }).observe(mr, { childList:true });

    // 6) foto de fons: es mou una mica més lenta que la carta (efecte profunditat)
    const bg = document.getElementById("menuBg");
    if (bg){
      let ticking = false;
      bg.style.transform = "scale(1.08)";
      window.addEventListener("scroll", ()=>{
        if (ticking) return; ticking = true;
        requestAnimationFrame(()=>{
          const y = Math.min(window.scrollY, 4000);
          bg.style.transform = `translateY(${-y * 0.035}px) scale(1.08)`;
          ticking = false;
        });
      }, { passive:true });
    }
  })();
  initRealtime();

  const splashScreenEl = document.getElementById("splashScreen");
  const splashEnterBtn = document.getElementById("splashEnterBtn");
  if (splashEnterBtn){
    splashEnterBtn.addEventListener("click", ()=>{
      if (splashScreenEl) splashScreenEl.classList.add("hide");
      setTimeout(renderOnboard, 250);
    });
  }
  // La barra de càrrega és només decorativa: quan acaba, es queda la pantalla de
  // benvinguda (logo + text + idioma) fins que el client premi el botó per entrar.
  setTimeout(()=>{
    if (splashScreenEl) splashScreenEl.classList.add("loaded");
  }, 1200);

  const scrollTopBtn = document.getElementById("scrollTopBtn");
  scrollTopBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>`;
  scrollTopBtn.addEventListener("click", ()=> window.scrollTo({top:0, behavior:"smooth"}));
  window.updateScrollTopPos = function(){
    const cartOpen = cartCount() > 0;
    scrollTopBtn.style.bottom = (cartOpen ? 88 : 20) + 64 + "px";
    scrollTopBtn.classList.toggle("show",
      state.view === "cliente" && !state.mascotOpen && window.scrollY > 480);
  };
  window.addEventListener("scroll", updateScrollTopPos, { passive:true });
  updateScrollTopPos();
})();
</script>
